name: E2E lab

# Manual per-release gate, launched from a PR: add the `e2e` label to a pull
# request and this boots a disposable kind cluster with real ArgoCD + Gitea +
# argo-watcher (built with -race) and runs the git-conflict soak and
# supersession race against the PR's branch. Re-run by removing and re-adding
# the label. Also dispatchable manually (workflow_dispatch) once on the default
# branch.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Git-conflict soak duration, in seconds"
        type: string
        default: "300"
      workers:
        description: "Concurrent deploy workers"
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (kind + real ArgoCD/Gitea)
    # Label path: run only when the `e2e` label is the one just added.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    # A measured full run is ~41m (8m boot + 33m phases) on a local machine; hosted
    # runners are slower, so 45 would leave almost no headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Node + Task + swag mirror the UI build the rest of the automation uses;
      # `task build-race-image` runs `task build-ui` to produce web/dist.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install build dependencies (swag for the UI's swagger step)
        run: task install-deps

      - name: Install kind, kubectl, helm
        env:
          KIND_VERSION: v0.31.0
          KUBECTL_VERSION: v1.36.2
          HELM_VERSION: v3.20.2
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --proto '=https' --tlsv1.2 -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$tmp" --strip-components=1 linux-amd64/helm
          sudo install -m 0755 "$tmp"/kind "$tmp"/kubectl "$tmp"/helm /usr/local/bin/

      # The phase suite runs under bats (test/e2e/phases.bats); the runner image
      # does not ship it. phases.bats loads no bats libraries, so core is enough.
      - name: Install bats
        env:
          BATS_VERSION: v1.12.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/bats-core/bats-core/archive/refs/tags/${BATS_VERSION}.tar.gz" \
            | tar -xz -C "$tmp" --strip-components=1
          sudo "$tmp/install.sh" /usr/local

      - name: Run e2e lab
        working-directory: test/e2e
        # Inputs bound to env (never interpolated into the script); defaults apply
        # on the label path where inputs are absent. On a hosted runner kind uses
        # the docker provider, so image loading takes its `kind load` fast path.
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '300' }}
          WORKERS: ${{ inputs.workers || '10' }}
        run: task e2e SOAK="${SOAK_SECONDS}s" SOAK_SECONDS="${SOAK_SECONDS}" WORKERS="${WORKERS}"

      # bats writes one JUnit case per phase; keep it on both outcomes so a failed
      # run says which phase broke without digging through the log.
      - name: Upload phase report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-phase-report
          path: test/e2e/reports/
          if-no-files-found: warn

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"; kubectl get pods -A || true; echo "::endgroup::"
          echo "::group::argo-watcher logs"; kubectl -n argo-watcher logs statefulset/argo-watcher --all-containers --tail=300 || true; echo "::endgroup::"
          echo "::group::applications"; kubectl -n argocd get applications -o wide || true; echo "::endgroup::"
