name: Run unit tests
on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - '.golangci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - '.golangci.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install environment dependencies
        run: task install-deps

      - name: Generate mocks
        # golangci-lint type-checks _test.go files, which import the gitignored
        # internal/mocks package; it must exist before the linters run.
        run: task mocks

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Matches the version the flake's nixpkgs pin gives the dev shell, so
          # `task lint-go` and this job report the same findings.
          version: v2.13.1

  # gosec and govulncheck moved to the dedicated security.yml workflow.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install environment dependencies
        run: task install-deps

      - name: Run database migrations
        run: task ci-migrate

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_NAME: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          STATE_TYPE: in-memory
          ARGO_URL: http://localhost:8081
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: task test

      # task test runs the whole tree without -race; run the server package under
      # the race detector so goroutine/shutdown races (e.g. the WebSocket hijack
      # path) fail CI instead of staying hidden. These tests are untagged and
      # self-contained, so no integration services are required.
      - name: Race-detect the server package
        env:
          DB_HOST: localhost
          DB_USER: postgres
          DB_NAME: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          STATE_TYPE: in-memory
          ARGO_URL: http://localhost:8081
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 -timeout=5m ./internal/server/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      gitea:
        image: gitea/gitea:1.22
        env:
          GITEA__security__INSTALL_LOCK: "true"
          GITEA__service__DISABLE_REGISTRATION: "false"
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/api/healthz || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 3000:3000
          - 2222:22

      # toxiproxy proxies SSH to gitea by service hostname. GH Actions places
      # all services on a shared Docker bridge network with embedded DNS, so
      # "gitea:22" resolves correctly between containers.
      # No health check: the toxiproxy image is distroless (no shell or wget),
      # so --health-cmd cannot run. Test code polls the admin API instead.
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.9.0
        ports:
          - 8474:8474
          - 12222:12222

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install environment dependencies
        run: task install-deps

      - name: Generate mocks
        # The generated mocks (internal/mocks) are gitignored; regenerate them so
        # every test file that imports them compiles before the tests run.
        run: task mocks

      # Keycloak cannot be a service container: it imports a realm from the
      # repository, and service containers start before the checkout that would
      # provide it. The suite polls the discovery endpoint itself, so no wait here.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8090:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "${GITHUB_WORKSPACE}/test/keycloak/argo-watcher-e2e-realm.json:/opt/keycloak/data/import/argo-watcher-e2e-realm.json:ro" \
            quay.io/keycloak/keycloak:26.7.0 start-dev --import-realm

      - name: Run integration tests
        # SSH_KEY_PATH and GIT_TIMEOUT are set per-test via t.Setenv inside
        # setupGitea / each test function; no workflow-level env needed here.
        # Every package holding integration-tagged tests must be listed explicitly
        # or they silently never run — and, worse, never even compile: internal/argocd
        # holds the git write-back suite (push-race, shallow-clone, batch write-back)
        # and internal/server holds the live-Keycloak deploy-lock and read-auth suite.
        run: go test -race -tags=integration -count=1 -timeout=10m ./internal/models/... ./internal/argocd/... ./internal/server/...

  frontend_test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: web
        run: npm run test -- --coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: web/coverage/lcov.info
          flags: frontend

  keycloak-e2e:
    name: Keycloak auth e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install environment dependencies
        run: task install-deps

      - name: Generate mocks
        # The Keycloak auth tests live in the server package, whose test files
        # import the gitignored internal/mocks package; regenerate it before
        # compiling them.
        run: task mocks

      - name: Start Keycloak
        # Imports test/keycloak on boot; the test polls the realm's OIDC
        # discovery endpoint for readiness (waitForKeycloak), so no --wait needed.
        run: docker compose --profile integration up -d keycloak

      - name: Run Keycloak auth integration tests
        # -run Keycloak keeps this job focused on the auth e2e; the server unit
        # tests are already covered by the `test` job.
        run: go test -race -tags=integration -count=1 -timeout=5m -run Keycloak ./internal/server/...

      - name: Stop Keycloak
        if: always()
        run: docker compose --profile integration down -v
