name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # gosec and govulncheck both need the Go module to build (and the generated
  # mocks the test files import), so they share one job. continue-on-error on
  # each scan plus the final gate means BOTH run to completion even if one finds
  # problems — the job collects all findings in a single pass and only then fails.
  go-scan:
    name: Go scanners (gosec + govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # An exact version skips the unauthenticated go-task tags API
          # lookup, which shares the runner IP 60 req/h anonymous quota.
          version: 3.53.1

      - name: Install environment dependencies
        run: task install-deps

      - name: Generate mocks
        # The mock package (internal/mocks) is gitignored and generated by
        # mockgen. gosec and govulncheck load the full package graph (including
        # _test.go files that import the mocks), so it must exist before the
        # scanners run.
        run: task mocks

      - name: Run Gosec Security Scanner
        id: gosec
        continue-on-error: true
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        env:
          # The gosec image bundles an older Go with GOTOOLCHAIN=local, so it
          # refuses a go.mod whose toolchain directive names a newer patch. Allow
          # it to fetch the toolchain named in go.mod instead of failing.
          GOTOOLCHAIN: auto
        with:
          # Exclude the e2e lab tooling (test/e2e): it is not shipped in any
          # release binary, and its git-exec / file-read / math-rand usage is
          # intentional for a disposable local lab, not a production attack surface.
          args: -exclude-dir=test/e2e ./...

      - name: Run govulncheck
        id: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Fail if any Go scanner failed
        if: steps.gosec.outcome == 'failure' || steps.govulncheck.outcome == 'failure'
        run: |
          echo "gosec: ${{ steps.gosec.outcome }}"
          echo "govulncheck: ${{ steps.govulncheck.outcome }}"
          exit 1

  trivy:
    name: Trivy (dependency vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan dependencies
        # Scans go.mod and web/package-lock.json, so both backend and frontend
        # dependencies are covered. The CI checkout is clean, so the in-repo Go
        # module cache the flake devshell creates locally (.go/.gomod) is absent
        # here — nothing to exclude.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

  retirejs:
    name: retire.js (bundled JavaScript libraries)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Scan for vulnerable JavaScript libraries
        # trivy and npm audit read package-lock.json, so they see only declared
        # dependencies. retire.js fingerprints versions in the JavaScript itself,
        # which is the only way to catch a library a prebuilt bundle vendors in
        # without declaring it — swagger-ui-dist inlines DOMPurify exactly so.
        working-directory: web
        run: npm run scan:js

  trufflehog:
    name: TruffleHog (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan can diff the pushed/PR commit range.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # .trufflehog-exclude skips files holding intentional non-secrets
          # (local dev credentials, SSH key fixtures). Keep it in sync with the
          # pre-commit hook's exclude regex.
          extra_args: --results=verified,unknown --exclude-paths .trufflehog-exclude
