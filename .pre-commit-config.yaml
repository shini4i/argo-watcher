repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-added-large-files
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy
      - id: go-imports

  # Secret scanning runs locally before a commit lands, so credentials never
  # reach a commit or CI. filesystem mode scans the staged files pre-commit
  # passes in (so no vendored/false-positive noise, and the about-to-be-
  # committed content is actually scanned). Uses the trufflehog binary from
  # the flake devshell (language: system), not the upstream hook's Go build;
  # that nixpkgs binary already disables the self-updater, so --no-update must
  # NOT be passed (it errors as a repeated flag).
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: trufflehog filesystem --results=verified,unknown --fail
        language: system
        # The excluded files hold deliberate non-secrets TruffleHog reports as
        # "unknown": dev credentials, SSH key fixtures, an example DSN, and a URL
        # whose fake password a test asserts never reaches an error. Filesystem mode
        # ignores --exclude-paths, so keep this in sync with .trufflehog-exclude.
        exclude: ^(docker-compose\.yml|internal/updater/updater_test\.go|docs/operations/database\.md|internal/config/argo_endpoint_test\.go)$
