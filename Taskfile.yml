version: '3'
silent: true

tasks:
  install-deps:
    desc: Install dependencies
    cmds:
      - echo "===> Installing dependencies"
      - go install github.com/swaggo/swag/cmd/swag@latest
      - go install go.uber.org/mock/mockgen@latest
      - go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
      - echo "===> Done"
    status:
      - type swag mockgen migrate

  mocks:
    desc: Generate mocks for tests
    cmds:
      - echo "===> Generating mocks"
      - mockgen --source=internal/argocd/argo_api.go --destination=internal/mocks/argo_api.go --package=mocks
      - mockgen --source=internal/state/state.go --destination=internal/mocks/state.go --package=mocks
      - mockgen --source=internal/prometheus/metrics.go --destination=internal/mocks/metrics.go --package=mocks
      - mockgen --source=internal/updater/interfaces.go --destination=internal/mocks/updater.go --package=mocks
      - mockgen --source=internal/notifications/webhook.go --destination=internal/mocks/notifications.go --package=mocks
      - mockgen --source=internal/auth/auth.go --destination=internal/mocks/auth.go --package=mocks
      - mockgen --source=internal/migrate/migrate.go --destination=internal/mocks/migrate.go --package=mocks
    sources:
      - internal/argocd/argo_api.go
      - internal/state/state.go
      - internal/prometheus/metrics.go
      - internal/updater/interfaces.go
      - internal/notifications/webhook.go
      - internal/auth/auth.go
      - internal/migrate/migrate.go
    generates:
      - internal/mocks/*.go

  docs:
    desc: Generate swagger spec
    dir: cmd/argo-watcher
    cmds:
      - echo "===> Generating swagger spec"
      - swag init --parseDependency --parseInternal --dir ./,../../internal/server --outputTypes json -o ../../web/public/swagger
      # argo_cd_url is documented as a string only because of the swaggertype tag on
      # ServerConfig; without it swag emits the fields of a url.URL and the published
      # spec silently contradicts what the endpoint serves.
      - |
        if ! grep -A1 '"argo_cd_url":' ../../web/public/swagger/swagger.json | grep -q '"type": "string"'; then
          echo "===> ERROR: argo_cd_url is not documented as a string (check the swaggertype tag)"
          exit 1
        fi
    sources:
      - main.go
      - ../../internal/server/router.go
    generates:
      - ../../web/public/swagger/swagger.json

  lint-go:
    desc: Lint the Go tree with golangci-lint
    deps: [mocks]
    cmds:
      - echo "===> Linting Go code"
      # Config, including the timeout, lives in .golangci.yml so this and the CI
      # job run the same checks.
      - golangci-lint run ./...

  lint-migrations:
    desc: Check that migrations stay forward-only
    cmds:
      - echo "===> Checking migrations"
      - ./scripts/lint-migrations.sh
      # The check only ever passes on this tree, so its own cases run too —
      # otherwise a regression that makes it permissive would look identical.
      - ./scripts/lint-migrations_test.sh
    sources:
      - db/migrations/*.up.sql
      - scripts/lint-migrations.sh
      - scripts/lint-migrations_test.sh

  test:
    desc: Run tests
    deps: [mocks, docs]
    env:
      DB_HOST: localhost
      DB_USER: watcher
      DB_NAME: watcher
      DB_PASSWORD: watcher
      DB_PORT: 5432
      STATE_TYPE: in-memory
    cmds:
      - echo "===> Running tests"
      - go test -v ./... -count=1 -coverprofile coverage.out

  test-integration:
    desc: Run integration tests (requires docker; brings up gitea + toxiproxy + keycloak). Must not be run concurrently.
    deps: [mocks]
    cmds:
      - echo "===> Starting integration services"
      - docker compose --profile integration up -d --wait gitea toxiproxy keycloak
      - defer: docker compose --profile integration down -v
      - echo "===> Running integration tests"
      - go test -v -race -tags=integration -count=1 -timeout=12m ./internal/models/... ./internal/server/... ./internal/argocd/...

  start-test-services:
    desc: Start test services
    internal: true
    cmds:
      - echo "===> Starting test services"
      - docker compose up -d postgres migrations
      - echo "===> Done"
    status:
      - docker ps | grep argo-watcher-postgres-1

  build:
    desc: Build the project
    deps: [docs]
    env:
      CGO_ENABLED: 0
    cmds:
      - echo "===> Building the project"
      - go build -ldflags="-s -w -X github.com/shini4i/argo-watcher/internal/server.version=local" -o argo-watcher ./cmd/argo-watcher
      - echo "===> Done"
    sources:
      - cmd/argo-watcher/**/*.go
    generates:
      - argo-watcher

  install-web-dependencies:
    desc: Install React-admin web dependencies
    internal: true
    dir: web
    cmds:
      - echo "===> Installing web dependencies"
      - npm ci
      - echo "===> Done"
    sources:
      - package.json
      - package-lock.json
    status:
      - test -x node_modules/.bin/vite

  lint-web:
    desc: Lint the React-admin workspace
    deps: [install-web-dependencies]
    dir: web
    cmds:
      - echo "===> Linting web workspace"
      - npm run lint
      - echo "===> Done"

  test-web:
    desc: Run React-admin unit tests
    deps: [install-web-dependencies]
    dir: web
    cmds:
      - echo "===> Running React-admin unit tests"
      - npm run test
      - echo "===> Done"

  scan-web:
    desc: Scan the web workspace's JavaScript for known-vulnerable libraries (retire.js)
    deps: [install-web-dependencies]
    dir: web
    cmds:
      # Fingerprints library versions inside JavaScript file contents, so it sees
      # dependencies a bundle vendors in without declaring them — which npm audit
      # and trivy, both of which read package-lock.json, cannot. Needs network:
      # retire.js fetches its advisory repository (cached under /tmp).
      - echo "===> Scanning web JavaScript for vulnerable libraries"
      - npm run scan:js
      - echo "===> Done"

  test-web-e2e:
    desc: Run the Playwright browser suite (requires docker; brings up keycloak). Must not be run concurrently with test-integration.
    deps: [install-web-dependencies, build-ui]
    cmds:
      - echo "===> Starting Keycloak"
      # No --wait: the keycloak image ships no shell tool, so compose cannot
      # health-check it. Poll the realm's discovery endpoint instead.
      - docker compose --profile integration up -d keycloak
      - defer: docker compose --profile integration down -v
      - |
        discovery=http://localhost:8090/realms/argo-watcher-e2e/.well-known/openid-configuration
        for _ in $(seq 1 60); do
          if curl -fsS "$discovery" >/dev/null 2>&1; then
            echo "===> Keycloak is ready"
            exit 0
          fi
          sleep 2
        done
        echo "Keycloak realm argo-watcher-e2e not ready after 120s" >&2
        exit 1
      - echo "===> Running Playwright suite"
      - cd web && npm run test:e2e

  build-ui:
    desc: Build the web UI bundle
    deps: [install-web-dependencies, docs]
    dir: web
    cmds:
      - echo "===> Building React-admin UI"
      - npm run build
      # dist/ is copied into the release image and served publicly, so a source map here
      # would expose the UI's own sources. Fail the build instead of shipping it. Only
      # dist/assets is scanned for the comment: swagger-ui.css ships one for a map that
      # is not copied.
      - |
        found=$(find dist -name '*.map'; grep -rl sourceMappingURL dist/assets || true)
        if [ -n "$found" ]; then
          echo "===> ERROR: source maps in web/dist (check build.sourcemap in vite.config.ts):"
          echo "$found"
          exit 1
        fi
      - echo "===> Done"
    sources:
      - src/**/*.ts
      - src/**/*.tsx
      - vite.config.ts
      # public/ is copied into dist verbatim, and the swagger page lives there.
      - public/**
    # Without this, an unchanged src plus a deleted or partial dist/ is reported
    # up to date and the build is skipped — leaving the consumers of web/dist
    # (the images, the Playwright suite) pointed at nothing.
    generates:
      - dist/index.html

  bootstrap:
    desc: Bring docker compose setup up
    cmds:
      - echo "===> Bringing docker compose setup up"
      - docker compose up -d
      - echo "===> Done"

  teardown:
    desc: Bring docker compose setup down
    cmds:
      - echo "===> Bringing docker compose setup down"
      - docker compose down
      - echo "===> Done"

  ci-migrate:
    desc: Run migrations in CI
    cmds:
      - echo "===> Running migrations"
      - migrate -path db/migrations -database "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" up
